name: Build and Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version and release decision
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os, re, subprocess

          ref_type = os.environ.get("REF_TYPE", "")
          ref_name = os.environ.get("REF_NAME", "")

          if ref_type == "tag":
              version = ref_name.lstrip("vV")
              tag_name = ref_name
              should_release = "true"
          else:
              m = re.search(r'__version__\s*=\s*["\']([^"\']+)',
                            open("src/core/version.py").read())
              version = m.group(1) if m else ""
              tag_name = f"v{version}"

              def parse(v):
                  return tuple(int(x) if x.isdigit() else 0
                               for x in v.lstrip("vV").split("."))

              head_tags = subprocess.run(["git", "tag", "--points-at", "HEAD"],
                                         capture_output=True, text=True).stdout.split()
              if tag_name in head_tags:
                  should_release = "true"
              else:
                  tags = subprocess.run(["git", "tag", "--list", "v*"],
                                        capture_output=True, text=True).stdout.split()
                  tags = [t for t in tags if t != tag_name]
                  latest = max(tags, key=parse) if tags else None
                  should_release = "true" if (version and (latest is None or parse(version) > parse(latest))) else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"tag_name={tag_name}\n")
              out.write(f"should_release={should_release}\n")
          print(f"Detected version={version} tag={tag_name} should_release={should_release}")
          EOF

  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install system deps (Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install Python deps
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v

  build-windows:
    name: Build Windows .exe
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run tests on Windows
        run: pip install -r requirements.txt pytest && python -m pytest tests/ -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Install build deps
        run: pip install -r requirements.txt pyinstaller
      - name: Build .exe
        run: pyinstaller --clean Radiography.spec
      - name: List dist contents
        run: dir dist\
        shell: cmd
      - name: Rename .exe with version
        shell: powershell
        run: |
          $ver = "${{ needs.check-version.outputs.version }}"
          Get-ChildItem dist\*.exe | Rename-Item -NewName { "Radiography-$ver-Windows-x64.exe" }
      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radiography-Windows-x64
          path: dist/Radiography-*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS .dmg
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run tests on macOS
        run: pip install -r requirements.txt pytest && python -m pytest tests/ -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Install build deps
        run: pip install -r requirements.txt pyinstaller dmgbuild
      - name: Build .app bundle (universal2)
        run: pyinstaller --clean Radiography.spec
      - name: Build .dmg
        run: |
          VER="${{ needs.check-version.outputs.version }}"
          DMG_NAME="Radiography-${VER}-macOS.dmg"
          DMG_VOLUME_NAME="Radiography ${VER}" dmgbuild -s dmg_settings.py "Radiography ${VER}" "dist/${DMG_NAME}"
          echo "DMG_NAME=${DMG_NAME}" >> $GITHUB_ENV
      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radiography-macOS-Universal
          path: dist/Radiography-*-macOS.dmg
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache buildozer (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer/android-sdk
            .buildozer/android-ndk
          key: buildozer-sdk-ndk-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-sdk-ndk-
      - name: Sync buildozer.spec version from src/core/version.py
        run: |
          VER="$(python3 -c "import re;print(re.search(r'__version__\\s*=\\s*[\"\\']([^\"\\']+)',open('src/core/version.py').read()).group(1))")"
          sed -i.bak "s/^version = .*/version = ${VER}/" buildozer.spec
          grep -n "^version = " buildozer.spec
      - name: Build APK with Buildozer (Docker)
        env:
          NO_RL_ACCEL: "1"
        run: |
          ok=0
          for i in 1 2 3 4; do
            if docker run --rm \
              -e NO_RL_ACCEL=1 \
              -e PIP_RETRIES=10 \
              -e PIP_TIMEOUT=60 \
              -e NDKPLATFORM=NOTNONE \
              -e KIVY_CROSS_PLATFORM=android \
              -v ${{ github.workspace }}:/app \
              -w /app \
              --entrypoint /bin/bash \
              ghcr.io/kivy/buildozer:latest \
              -c "apt-get update -qq && apt-get install -y -qq wget libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev && buildozer android debug"; then
              ok=1
              break
            fi
            echo "Android build attempt $i failed; retrying in 30s..."
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Android build failed after 4 attempts"
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radiography-Android-APK
          path: bin/*.apk
          if-no-files-found: error
      - name: Upload AAB artifact
        if: hashFiles('bin/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Radiography-Android-AAB
          path: bin/*.aab
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: [check-version, build-windows, build-macos, build-android]
    if: |
      always() &&
      !cancelled() &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Radiography-Windows-x64
          path: release-artifacts
      - name: Download macOS artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Radiography-macOS-Universal
          path: release-artifacts
      - name: Download Android APK artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Radiography-Android-APK
          path: release-artifacts
      - name: Download Android AAB artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Radiography-Android-AAB
          path: release-artifacts
      - name: List release artifacts
        run: ls -lh release-artifacts/
      - name: Extract release notes from CHANGELOG
        run: |
          VER="${{ needs.check-version.outputs.version }}"
          python3 -c "
          import re, sys
          with open('CHANGELOG.md') as f:
              content = f.read()
          ver = '${VER}'
          pattern = r'##\s+\[?' + re.escape(ver) + r'\]?.*?\n(.*?)(?=\n##\s|$)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              with open('release_notes.txt', 'w') as out:
                  out.write(notes)
          else:
              with open('release_notes.txt', 'w') as out:
                  out.write('See CHANGELOG.md for details.')
          "
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: Radiography ${{ needs.check-version.outputs.tag_name }}
          body_path: release_notes.txt
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
