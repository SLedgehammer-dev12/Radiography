name: Build and Release (Web Launchers)
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version and release decision
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os, re, subprocess

          event_name = os.environ.get("EVENT_NAME", "")
          ref_type = os.environ.get("REF_TYPE", "")
          ref_name = os.environ.get("REF_NAME", "")

          if ref_type == "tag":
              version = ref_name.lstrip("vV")
              tag_name = ref_name
              should_release = "true"
          else:
              m = re.search(r'__version__\s*=\s*["\']([^"\']+)',
                            open("src/core/version.py").read())
              version = m.group(1) if m else ""
              tag_name = f"v{version}"

              def parse(v):
                  return tuple(int(x) if x.isdigit() else 0
                               for x in v.lstrip("vV").split("."))

              all_tags = subprocess.run(["git", "tag", "--list", "v*"],
                                        capture_output=True, text=True).stdout.split()
              if event_name == "workflow_dispatch":
                  should_release = "true" if version else "false"
              elif tag_name in all_tags:
                  # Tag already exists (either pushed alongside main, which triggers
                  # the dedicated tag workflow, or from a previous release) -> skip
                  # duplicate release build on the branch push.
                  should_release = "false"
              else:
                  latest = max((t for t in all_tags if t != tag_name),
                               key=parse, default=None)
                  should_release = "true" if (
                      version and (latest is None or parse(version) > parse(latest))
                  ) else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"tag_name={tag_name}\n")
              out.write(f"should_release={should_release}\n")
          print(f"Detected version={version} tag={tag_name} should_release={should_release}")
          EOF

  test:
    name: Test (Python & Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install system deps (Qt headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install Python deps
        run: pip install -r requirements.txt pytest
      - name: Run Python core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run Web typecheck and lint
        working-directory: web
        run: |
          npm ci
          npm run lint
          npx tsc -b

  build-web-launcher:
    name: Build Web Launcher (${{ matrix.os }})
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: pip install "pyinstaller<7" pillow
      - name: Package launcher (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python web/launcher/package.py --onefile
      - name: Package launcher (macOS)
        if: runner.os == 'macOS'
        run: python3 web/launcher/package.py --onefile --dmg
      - name: Smoke test launcher (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN=$(ls release-artifacts/*Windows-x64.exe | head -1)
          "$BIN" --no-gui --no-browser --port 8767 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf --max-time 2 http://127.0.0.1:8767/healthz >/dev/null; then ok=1; break; fi
          done
          curl -s --max-time 3 http://127.0.0.1:8767/healthz || true
          kill $PID 2>/dev/null || true
          test "$ok" = "1"
      - name: Smoke test launcher (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d "release-artifacts/Radiography Web "*.app | head -1)
          codesign --verify --deep --strict "$APP"
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          "$BIN" --no-gui --no-browser --port 8767 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf --max-time 2 http://127.0.0.1:8767/healthz >/dev/null; then ok=1; break; fi
          done
          curl -s --max-time 3 http://127.0.0.1:8767/healthz || true
          kill $PID 2>/dev/null || true
          test "$ok" = "1"
      - name: Upload Windows launcher
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Radiography-Web-Windows
          path: release-artifacts/*.exe
          if-no-files-found: error
      - name: Upload macOS launcher
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Radiography-Web-macOS
          path: release-artifacts/*.dmg
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [check-version, build-web-launcher]
    if: |
      always() &&
      !cancelled() &&
      needs.build-web-launcher.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Web launcher (Windows)
        uses: actions/download-artifact@v4
        with:
          name: Radiography-Web-Windows
          path: release-artifacts
      - name: Download Web launcher (macOS)
        uses: actions/download-artifact@v4
        with:
          name: Radiography-Web-macOS
          path: release-artifacts
      - name: List release artifacts
        run: ls -lh release-artifacts/
      - name: Extract release notes from CHANGELOG
        run: |
          VER="${{ needs.check-version.outputs.version }}"
          python3 -c "
          import re, sys
          with open('CHANGELOG.md') as f:
              content = f.read()
          ver = '${VER}'
          pattern = r'##\s+\[?' + re.escape(ver) + r'\]?.*?\n(.*?)(?=\n##\s|$)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              with open('release_notes.txt', 'w') as out:
                  out.write(notes)
          else:
              with open('release_notes.txt', 'w') as out:
                  out.write('See CHANGELOG.md for details.')
          "
      - name: Append SHA-256 checksums to release notes
        run: |
          echo "" >> release_notes.txt
          echo "## Artifact checksums (SHA-256)" >> release_notes.txt
          for f in release-artifacts/*; do
            [ -f "$f" ] || continue
            h=$(sha256sum "$f" | awk '{print $1}')
            echo "sha256: $h  $(basename "$f")" >> release_notes.txt
          done
          cat release_notes.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: Radiography ${{ needs.check-version.outputs.tag_name }}
          body_path: release_notes.txt
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
